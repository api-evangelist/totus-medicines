name: Totus Medicines
description: >-
  Totus Medicines is a biopharmaceutical company developing precision oral
  medicines against historically "undruggable" disease targets. The company's
  OmniDEL discovery platform screens targets in their normal cellular
  environment to identify potent, selective covalent small molecules, drawing on
  precedents like penicillin and AZT. Totus is advancing a pipeline focused on
  oncology and immunology & inflammation (I&I), including TOS-358, a covalent
  PI3Ka inhibitor, and a first-in-class covalent IRF5 inhibitor in clinical
  development. Headquartered in Emeryville, California, Totus was surfaced as a
  portfolio company of DCVC and profiled in the API Evangelist network. As a
  clinical-stage drug-discovery company, Totus publishes no public developer API
  surface; this profile captures its corporate identity, web properties, and
  security posture.
